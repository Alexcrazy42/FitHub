  #   networks:
  #     - app-net
  #   healthcheck:
  #     test: [ "CMD-SHELL", "pg_isready -U postgres" ]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5


networks:
  app-net:
    driver: bridge

volumes:
  platform_postgres_data:
  bank_manager_postgres_data:
  minio_data: